<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartQ - Painel de Atendimento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>SmartQ</h1>
            <p>Painel de Atendimento</p>
        </header>

        <section class="painel">

            <!-- Seleção da fila de atendimento -->
            <div class="campo">
                <label for="filaSelect">Fila</label>

                <select id="filaSelect">
                    <option value="">Carregando filas...</option>
                </select>
            </div>

            <!-- Senha atualmente chamada -->
            <div class="senha-atual">
                <span>Senha atual</span>
                <strong id="senhaAtual">-</strong>
            </div>

            <!-- Informações da fila -->
            <div class="informacoes">

                <p>
                    Pessoas aguardando:
                    <strong id="quantidadeAguardando">0</strong>
                </p>

                <p>
                    Próxima senha:
                    <strong id="proximaSenha">-</strong>
                </p>

            </div>

            <!-- Ações do atendente -->
            <div class="acoes">

                <button id="btnChamar">
                    Chamar próxima
                </button>

                <button id="btnFinalizar">
                    Finalizar atendimento
                </button>

            </div>

            <!-- Configuração do painel IoT -->
            <hr class="separador">

            <div class="painel-iot">

                <h2>Painel</h2>

                <div class="campo">
                    <label for="painelFilaSelect">
                        Fila exibida no painel
                    </label>

                    <select id="painelFilaSelect">
                        <option value="">Carregando filas...</option>
                    </select>
                </div>

                <button id="btnAtualizarPainel" class="btn-iot">
                    Atualizar painel
                </button>

                <p id="mensagemPainel" class="mensagem-painel"></p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>

# Publica o painel Web do SmartQ no GitHub Pages
name: Deploy SmartQ Web

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/static.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do SmartQ Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

      - name: Publicar SmartQ Web
        id: deployment
        uses: actions/deploy-pages@v5
